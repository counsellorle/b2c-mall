server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: shop-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:47.100.22.158:8848}
        namespace: ${NACOS_NAMESPACE:zhuduole}
      config:
        server-addr: ${NACOS_ADDR:47.100.22.158:8848}
        namespace: ${NACOS_NAMESPACE:zhuduole}
        file-extension: yaml
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./shop.db?foreign_keys=on}
  redis:
    host: ${REDIS_HOST:47.100.22.158}
    port: ${REDIS_PORT:6379}
    database: 0
    timeout: 5000

mybatis:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: shop-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cloud:
    nacos:
      discovery:
        # 地址由环境变量注入；默认值仅指向本地，不含任何外部服务器地址
        # 部署时参见 .env.example，容器内由 docker-compose 注入服务名
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./shop.db?foreign_keys=on}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: 0
    timeout: 5000

mybatis:
  configuration:
    map-underscore-to-camel-case: true